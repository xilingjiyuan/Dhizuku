name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set environments
        run: |
          repo="$(echo ${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/})"
          version="v$(grep versionName version.properties | awk -F\= '{print $2}')"
          {
            echo "repo=$repo"
            echo "version=$version"
            echo "artifact=$repo-$version"
          } >> $GITHUB_ENV

      - name: Clean and Build Release APK with TestKey
        run: |
          # 移除项目自带的旧密钥，强制使用默认测试签名，彻底避免密钥不兼容报错
          rm -rf keystore/r0s.*
          ./gradlew clean assembleRelease
          cp -f app/build/outputs/apk/release/app-release.apk "${{ env.artifact }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ env.artifact }}.apk
